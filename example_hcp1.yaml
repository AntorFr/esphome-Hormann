# Generic example — Hörmann HCP1 on ESP32 + a NON-isolated RS485 module (MAX485 / SP3485, with DE).
# UAP1 emulator: state read-out AND command.
# For the WeAct CAN485 (ISOLATED transceiver), see example_can485.yaml.
#
# Wiring: module A/B to the bus (DATA+/DATA-). If nothing decodes -> try ab_inverted.
# A module with DE (separate, or tied together on one GPIO) is REQUIRED to COMMAND: the component
# drives DE to transmit. An auto-direction module without DE can only READ the state.

substitutions:
  name: hormann-garage
  friendly_name: "Hörmann Garage"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf          # REQUIRED by the hormann_hcp1 component

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}
    password: !secret ap_password

captive_portal:

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: git
      url: https://github.com/AntorFr/esphome-Hormann
      ref: main
    components: [ hormann_hcp1 ]

hormann_hcp1:
  id: hormann
  uart_num: 1
  tx_pin: GPIO17       # RS485 module DI
  rx_pin: GPIO16       # RS485 module RO
  de_pin: GPIO4        # DE (active-high) — REQUIRED to transmit/command
  # re_pin: GPIO5      # if /RE is on a separate GPIO (otherwise tied together / to GND)
  ab_inverted: auto    # off | true | auto — auto-detect A/B polarity at boot
  reply_delay_us: 3800 # reply latency tuned to a real UAP1 (~3.84 ms)
  sniffer: false       # true = log the bus frames (debug)

cover:
  - platform: hormann_hcp1
    id: garage_door
    name: "Garage Door"
    hormann_hcp1_id: hormann
    device_class: garage

light:
  - platform: hormann_hcp1
    id: garage_light
    name: "Garage Light"
    hormann_hcp1_id: hormann

binary_sensor:
  - platform: hormann_hcp1
    hormann_hcp1_id: hormann
    light:
      name: "Light Status"
    error:
      name: "Error"
    venting:
      name: "Venting Position"
    prewarn:
      name: "Pre-warning"

button:
  - platform: hormann_hcp1
    name: "Impulse"
    hormann_hcp1_id: hormann
    action: impulse
    icon: "mdi:gesture-tap"
  - platform: hormann_hcp1
    name: "Venting Position"
    hormann_hcp1_id: hormann
    action: venting
    icon: "mdi:air-filter"
  - platform: hormann_hcp1
    name: "Emergency Stop"
    hormann_hcp1_id: hormann
    action: emergency_stop
    icon: "mdi:stop-circle"
    entity_category: diagnostic
