substitutions:
  device_name: garage-3-test
  friendly_name: "garage-3-test"
  area: "Garage 3"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  area: ${area}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: 3.1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: ${device_name}.intra.sberard.fr

  ap:
    ssid: ${device_name}
    password: !secret ap_password

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_encryption

ota:
  platform: esphome
  password: !secret ota_password

captive_portal:

logger:
  level: DEBUG

#######################################
# Device specific Config Begins Below #
#######################################
packages:
  device_base:
    url: https://github.com/AntorFr/esphome-projects
    ref: master
    files: [ packages/device_base.yaml ]
    refresh: 0s

status_led:
  pin: GPIO23

# TEMP DEBUG: raw uart sniffer (same as witness) to compare raw bus bytes side-by-side
uart:
  id: bus_uart
  rx_pin:
    number: GPIO19
    inverted: false   # set to true to test polarity inversion
  tx_pin: GPIO17
  baud_rate: 19200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512
  debug:
    direction: RX
    dummy_receiver: true
    after:
      timeout: 5ms
      bytes: 64

