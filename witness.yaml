# RS485 bus witness: runs the hormann_hcp1 component in SNIFFER mode (RX-only).
# Wired in parallel on A/B of the Hörmann bus, with DE and /RE of the RS485 module
# tied to GND (receiver always on, driver disabled -> the component owns the UART but
# physically cannot drive the bus).
# Replaces the old raw uart.debug dump: logs only valid, categorized, de-duplicated
# frames at INFO ("SNIFF ...") plus a 10 s heartbeat. Also acts as the TX oracle:
# garage-3's scan-replies (addressed to the master) show up here as "->master" if our
# TX polarity is correct.

substitutions:
  device_name: hormann-witness
  friendly_name: "Hormann Bus Witness"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${device_name}
    password: !secret ap_password

api:
  encryption:
    key: !secret api_encryption

ota:
  platform: esphome
  password: !secret ota_password

logger:
  level: INFO   # sniffer logs at INFO; raise to DEBUG for the raw per-byte dump

external_components:
  - source:
      type: local
      path: components
    components: [ hormann_hcp1 ]

# Passive bus witness. No de_pin: DE/RE are tied to GND on the module, so the
# component cannot drive the bus even though it owns the UART (RX-only sniffer).
hormann_hcp1:
  id: hormann
  uart_num: 1
  tx_pin: 17           # DI (unused — driver disabled via DE->GND)
  rx_pin: 18           # RO of the RS485 module
  ab_inverted: false   # polarity confirmed: valid CRCs at inverted:false
  listen_only: true    # ORACLE VRAIMENT PASSIF: ne répond JAMAIS aux scans 0x28
                       # (l'oubli d'origine: sans ça le witness émettait sa propre scan-réponse eager ~400µs -> 2e répondeur sur le bus)
  sniffer: true
  auto_scan: false
