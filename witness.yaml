# RS485 bus witness: dumps every received byte to logs.
# Use this on a 2nd ESP wired in parallel on A/B of the Hörmann bus,
# with DE and /RE of the RS485 module tied to GND (RX-only).

substitutions:
  device_name: hormann-witness
  friendly_name: "Hormann Bus Witness"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${device_name}
    password: !secret ap_password

api:
  encryption:
    key: !secret api_encryption

ota:
  platform: esphome
  password: !secret ota_password

logger:
  level: VERBOSE

uart:
  id: bus_uart
  rx_pin:
    number: GPIO18   # RO of RS485 module
    inverted: true   # Hörmann E3 uses inverted RS485 polarity vs our modules
  tx_pin: GPIO17     # DI (unused but ESPHome requires both)
  baud_rate: 19200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512
  debug:
    direction: RX
    dummy_receiver: true
    after:
      timeout: 5ms
      bytes: 64
