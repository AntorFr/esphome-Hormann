substitutions:
  device_name: garage-can485
  friendly_name: "Garage CAN485"
  area: "Garage 3"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  area: ${area}

# WeAct CAN485 DevBoard V1 — ESP32-D0WD-V3, transceiver RS485 ISOLÉ CA-IS2092A.
# Pinout carte: DI(TX)=GPIO22, RO(RX)=GPIO21, DE=GPIO17, WS2812=GPIO4, KEY=GPIO0.
# (retirer la carte microSD pendant le flash — SD sur GPIO2/13/14/15)
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: 3.1
      sram1_as_iram: true 

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: ${device_name}.intra.sberard.fr
  ap:
    ssid: ${device_name}
    password: !secret ap_password

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_encryption

ota:
  platform: esphome
  password: !secret ota_password

captive_portal:

logger:
  level: INFO

packages:
  device_base:
    url: https://github.com/AntorFr/esphome-projects
    ref: master
    files: [ packages/device_base.yaml ]
    refresh: 0s

external_components:
  - source:
      type: local
      path: components
    components: [ hormann_hcp1, status_led_rgb ]

# Hörmann HCP1 sur le transceiver isolé CA-IS2092A de la WeAct CAN485.
# Câblage bus: pin6 DATA+ -> borne B-, pin5 DATA- -> borne A+ (A/B INVERSÉS physiquement,
# cf. ab_inverted), pin3 GND -> Mass. PUPD OFF.
hormann_hcp1:
  id: hormann
  uart_num: 1
  tx_pin: GPIO22       # DI  (ESP -> bus)
  rx_pin: GPIO21       # RO  (bus -> ESP)
  de_pin: GPIO17       # DE  (driver enable, actif-haut)
  # re_pin non requis: /RE géré par la carte (combiné/à GND)
  ab_inverted: true    # A/B inversés PHYSIQUEMENT (swap obligatoire pour réveiller le RX du
                       # transceiver isolé CA-IS2092A) -> ré-inversion logicielle RX+TX
  reply_delay_us: 3800 # latence de réponse calée sur un vrai UAP1 (~3.84 ms)
  sniffer: false       # true = logger les trames du bus (debug)


cover:
  - platform: hormann_hcp1
    id: garage_door
    name: "Garage Door"
    hormann_hcp1_id: hormann
    device_class: garage

light:
  - platform: esp32_rmt_led_strip
    id: status_strip
    internal: true
    pin: GPIO4
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

  - platform: hormann_hcp1
    id: garage_light
    name: "Garage Light"
    hormann_hcp1_id: hormann

# Indicateur d'état type `status_led` mais en couleur sur la WS2812 :
#   fixe vert = OK, clignotement lent orange = warning, rapide rouge = erreur.
status_led_rgb:
  light_id: status_strip

binary_sensor:
  - platform: hormann_hcp1
    hormann_hcp1_id: hormann
    light:
      name: "Light Status"
      id: light_status
    error:
      name: "Error"
      id: error_status
    venting:
      name: "Venting Position"
      id: venting_status
    prewarn:
      name: "Pre-warning"
      id: prewarn_status

button:
  - platform: hormann_hcp1
    id: impulse_button
    name: "Impulse"
    hormann_hcp1_id: hormann
    action: impulse
    icon: "mdi:gesture-tap"

  - platform: hormann_hcp1
    id: venting_button
    name: "Venting Position"
    hormann_hcp1_id: hormann
    action: venting
    icon: "mdi:air-filter"

  - platform: hormann_hcp1
    id: emergency_stop_button
    name: "Emergency Stop"
    hormann_hcp1_id: hormann
    action: emergency_stop
    icon: "mdi:stop-circle"
    entity_category: diagnostic
