substitutions:
  device_name: witness-can485
  friendly_name: "Witness CAN485"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

# WeAct CAN485 DevBoard V1 — ESP32-D0WD-V3, transceiver RS485 ISOLÉ CA-IS2092A.
# Witness PASSIF (listen_only): pilote DE bas pour rester en réception, n'émet JAMAIS.
# Sur cette carte DE est sur GPIO17 (pas câblé à GND) -> il FAUT le tenir bas via listen_only.
# Pinout: DI(TX)=GPIO22, RO(RX)=GPIO21, DE=GPIO17. (retirer microSD au flash)
esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: ${device_name}.intra.sberard.fr
  ap:
    ssid: ${device_name}
    password: !secret ap_password

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_encryption

ota:
  platform: esphome
  password: !secret ota_password

captive_portal:

logger:
  level: INFO   # le sniffer logue les trames valides + JUNK + OUR-SCANRESP<<< à INFO

external_components:
  - source:
      type: local
      path: components
    components: [ hormann_hcp1, status_led_rgb ]

light:
  # WS2812 onboard (GPIO4) pilotée par le composant status_led_rgb ci-dessous.
  - platform: esp32_rmt_led_strip
    id: status_strip
    internal: true
    pin: GPIO4
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

# Indicateur d'état type `status_led` mais en couleur sur la WS2812 :
#   fixe vert = OK, clignotement lent orange = warning, rapide rouge = erreur.
status_led_rgb:
  light_id: status_strip

# Witness/oracle: décode tout le bus, ne pilote jamais, flag OUR-SCANRESP<<< quand
# il voit NOTRE réponse (80:..:14:28 / 0x29) + Δµs inter-trame.
hormann_hcp1:
  id: hormann
  uart_num: 1
  tx_pin: 22          # DI (inutilisé en listen_only mais requis par le schéma)
  rx_pin: 21          # RO (bus -> ESP)
  de_pin: GPIO17      # tenu BAS par listen_only -> transceiver en réception
  de_invert: false
  listen_only: true   # n'émet jamais (DE toujours bas)
  sniffer: true        # oracle: trames valides catégorisées + junk + Δµs
  ab_inverted: auto    # auto-détection polarité au boot
  auto_scan: false
