# VALIDATED example — Hörmann HCP1 on a WeAct CAN485 DevBoard (ISOLATED RS485 transceiver CA-IS2092A).
# Full UAP1 emulator: state read-out AND command (impulse / open / close / light / venting / stop).
#
# ⚠️ BUS -> BOARD WIRING (A and B physically SWAPPED, see ab_inverted):
#     bus pin 6  DATA+  ->  RS485 terminal  B-
#     bus pin 5  DATA-  ->  RS485 terminal  A+
#     bus pin 3  GND    ->  RS485 terminal  GND (Mass)
#   Board switches: PUPD = OFF, 120 Ω termination = ON (but OFF is working as well).
#   Why the swap: the isolated transceiver's fail-safe reads the Hörmann bus (which drives
#   asymmetrically) as idle -> swapping A/B wakes it up. Details: investigation/README.md

substitutions:
  name: hormann-can485
  friendly_name: "Hörmann CAN485"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf          # REQUIRED by the hormann_hcp1 component

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}
    password: !secret ap_password

captive_portal:

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: git
      url: https://github.com/AntorFr/esphome-Hormann
      ref: main
    components: [ hormann_hcp1, status_led_rgb ]

hormann_hcp1:
  id: hormann
  uart_num: 1
  tx_pin: GPIO22       # DI
  rx_pin: GPIO21       # RO
  de_pin: GPIO17       # DE (active-high)
  ab_inverted: true    # A/B physically swapped -> software re-inversion RX+TX
  reply_delay_us: 3800 # reply latency tuned to a real UAP1 (~3.84 ms)
  sniffer: false       # true = log the bus frames (debug)

light:
  # Onboard WS2812 (GPIO4) -> status indicator via status_led_rgb (green=OK / orange=warn / red=err)
  - platform: esp32_rmt_led_strip
    id: status_strip
    internal: true
    pin: GPIO4
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
  - platform: hormann_hcp1
    id: garage_light
    name: "Garage Light"
    hormann_hcp1_id: hormann

status_led_rgb:
  light_id: status_strip

cover:
  - platform: hormann_hcp1
    id: garage_door
    name: "Garage Door"
    hormann_hcp1_id: hormann
    device_class: garage

binary_sensor:
  - platform: hormann_hcp1
    hormann_hcp1_id: hormann
    light:
      name: "Light Status"
    error:
      name: "Error"
    venting:
      name: "Venting Position"
    prewarn:
      name: "Pre-warning"
    registered:
      name: "Registered"        # ON = the operator polls us (status_request) -> commands work

button:
  - platform: hormann_hcp1
    name: "Impulse"
    hormann_hcp1_id: hormann
    action: impulse
    icon: "mdi:gesture-tap"
  - platform: hormann_hcp1
    name: "Venting Position"
    hormann_hcp1_id: hormann
    action: venting
    icon: "mdi:air-filter"
  - platform: hormann_hcp1
    name: "Emergency Stop"
    hormann_hcp1_id: hormann
    action: emergency_stop
    icon: "mdi:stop-circle"
    entity_category: diagnostic
