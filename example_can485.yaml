# Exemple VALIDÉ — Hörmann HCP1 sur WeAct CAN485 DevBoard (transceiver RS485 ISOLÉ CA-IS2092A).
# Émulateur UAP1 complet : lecture d'état ET commande (impulse / open / close / light / venting / stop).
#
# ⚠️ CÂBLAGE BUS -> CARTE (A et B INVERSÉS physiquement, cf. ab_inverted) :
#     bus pin 6  DATA+  ->  borne RS485  B-
#     bus pin 5  DATA-  ->  borne RS485  A+
#     bus pin 3  GND    ->  borne RS485  GND (Mass)
#   Switches carte : PUPD = OFF, terminaison 120 Ω = OFF (le maître biaise/termine déjà).
#   Pourquoi l'inversion : le fail-safe du transceiver isolé lit le bus Hörmann (qui drive
#   asymétrique) comme idle -> inverser A/B le réveille. Détails : investigation/README.md

substitutions:
  name: hormann-can485
  friendly_name: "Hörmann CAN485"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf          # REQUIS par le composant hormann_hcp1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}
    password: !secret ap_password

captive_portal:

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: local
      path: components
    components: [ hormann_hcp1, status_led_rgb ]

hormann_hcp1:
  id: hormann
  uart_num: 1
  tx_pin: GPIO22       # DI
  rx_pin: GPIO21       # RO
  de_pin: GPIO17       # DE (actif-haut)
  ab_inverted: true    # A/B inversés physiquement -> ré-inversion logicielle RX+TX
  reply_delay_us: 3800 # latence de réponse calée sur un vrai UAP1 (~3.84 ms)
  sniffer: false       # true = logger les trames du bus (debug)

light:
  # WS2812 onboard (GPIO4) -> indicateur d'état via status_led_rgb (vert=OK/orange=warn/rouge=err)
  - platform: esp32_rmt_led_strip
    id: status_strip
    internal: true
    pin: GPIO4
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
  - platform: hormann_hcp1
    id: garage_light
    name: "Garage Light"
    hormann_hcp1_id: hormann

status_led_rgb:
  light_id: status_strip

cover:
  - platform: hormann_hcp1
    id: garage_door
    name: "Garage Door"
    hormann_hcp1_id: hormann
    device_class: garage

binary_sensor:
  - platform: hormann_hcp1
    hormann_hcp1_id: hormann
    light:
      name: "Light Status"
    error:
      name: "Error"
    venting:
      name: "Venting Position"
    prewarn:
      name: "Pre-warning"

button:
  - platform: hormann_hcp1
    name: "Impulse"
    hormann_hcp1_id: hormann
    action: impulse
    icon: "mdi:gesture-tap"
  - platform: hormann_hcp1
    name: "Venting Position"
    hormann_hcp1_id: hormann
    action: venting
    icon: "mdi:air-filter"
  - platform: hormann_hcp1
    name: "Emergency Stop"
    hormann_hcp1_id: hormann
    action: emergency_stop
    icon: "mdi:stop-circle"
    entity_category: diagnostic
