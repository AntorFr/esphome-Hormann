substitutions:
  device_name: garage-can485       # même nom -> OTA/logs WiFi vers la même carte
  friendly_name: "Garage CAN485 RAW UART"

# TEST BAS NIVEAU : aucun composant hormann_hcp1. Juste l'UART natif ESPHome en
# lecture brute sur GPIO21 (RO), dump hex de TOUT ce qui arrive. DE (GPIO17) forcé
# bas pour mettre le transceiver en réception (comme listen_only).
#   - si on voit des octets ici -> notre hormann_hcp1 a un bug
#   - si 0 octet -> c'est le hardware (RO ne bascule pas / alim isolée / transceiver)

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - output.turn_off: de_pin   # DE bas = transceiver en RX

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: ${device_name}.intra.sberard.fr
  ap:
    ssid: ${device_name}
    password: !secret ap_password

api:
  encryption:
    key: !secret api_encryption

ota:
  platform: esphome
  password: !secret ota_password

logger:
  level: VERBOSE

# DE (GPIO17) piloté en sortie, forcé bas au boot -> récepteur actif.
output:
  - platform: gpio
    pin: GPIO17
    id: de_pin

uart:
  - id: uart_raw
    rx_pin: GPIO21
    tx_pin: GPIO22
    baud_rate: 19200
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512
    debug:
      direction: RX
      dummy_receiver: true
      after:
        bytes: 256
        timeout: 40ms
      sequence:
        - lambda: |-
            std::string s;
            char buf[4];
            for (uint8_t b : bytes) {
              sprintf(buf, "%02X ", b);
              s += buf;
            }
            ESP_LOGI("rawuart", "RX[%u]: %s", (unsigned) bytes.size(), s.c_str());
