substitutions:
  device_name: garage-3-test
  friendly_name: "garage-3-test"
  area: "Garage 3"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  area: ${area}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: 3.1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: ${device_name}.intra.sberard.fr

  ap:
    ssid: ${device_name}
    password: !secret ap_password

api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_encryption

ota:
  platform: esphome
  password: !secret ota_password

captive_portal:

logger:
  level: INFO   # was DEBUG: at high frame rate the per-byte RX dump from the bus
                # task floods the logger and crash-loops the app. Sniffer logs at INFO.

#######################################
# Device specific Config Begins Below #
#######################################
packages:
  device_base:
    url: https://github.com/AntorFr/esphome-projects
    ref: master
    files: [ packages/device_base.yaml ]
    refresh: 0s

external_components:
  - source:
      type: local
      path: components
    components: [ hormann_hcp1 ]

status_led:
  pin: GPIO23

# Hörmann HCP1 component (owns UART1 directly via ESP-IDF native driver)
hormann_hcp1:
  id: hormann
  uart_num: 1
  tx_pin: 17   # Connect to RX on RS485 module (crossed!)
  rx_pin: 19   # Connect to TX/RO on RS485 module (crossed!)
  de_pin: GPIO4
  # re_pin: GPIO5
  auto_scan: false
  de_invert: false
  tx_test: false        # bus spammer off; TX proven clean (INVESTIGATION 4sexies/septies)
  bustask_tx_test: false # diagnostic off; drive proven OK, blocker = timing (4septies)
  ab_inverted: false   # polarity confirmed: valid CRCs at inverted:false (marking wiring)
  sniffer: false       # lean bus_task; the witness keeps sniffer:true as the oracle
  reply_delay_us: 0    # was 1000: that 1ms was pure added latency; back to 0 (4septies)

cover:
  - platform: hormann_hcp1
    id: garage_door
    name: "Garage Door"
    hormann_hcp1_id: hormann
    device_class: garage

light:
  - platform: hormann_hcp1
    id: garage_light
    name: "Garage Light"
    hormann_hcp1_id: hormann

binary_sensor:
  - platform: hormann_hcp1
    hormann_hcp1_id: hormann
    light:
      name: "Light Status"
      id: light_status
    error:
      name: "Error"
      id: error_status
    venting:
      name: "Venting Position"
      id: venting_status
    prewarn:
      name: "Pre-warning"
      id: prewarn_status

button:
  - platform: hormann_hcp1
    id: impulse_button
    name: "Impulse"
    hormann_hcp1_id: hormann
    action: impulse
    icon: "mdi:gesture-tap"

  - platform: hormann_hcp1
    id: venting_button
    name: "Venting Position"
    hormann_hcp1_id: hormann
    action: venting
    icon: "mdi:air-filter"

  - platform: hormann_hcp1
    id: emergency_stop_button
    name: "Emergency Stop"
    hormann_hcp1_id: hormann
    action: emergency_stop
    icon: "mdi:stop-circle"
    entity_category: diagnostic

